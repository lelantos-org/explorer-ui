# Explorer SPA.
#
# Deliberately WITHOUT the Cross-Origin-Opener-Policy / Embedder-Policy headers
# that webapp-ui sets: those exist there to enable SharedArrayBuffer for the
# wasm-threads prover. This app has no wasm and no worker threads, so imposing
# cross-origin isolation here would only break embedding third-party resources
# for no benefit.

# Docker's embedded DNS. Resolving through a variable defers the lookup to
# request time, so nginx still starts when the API container is not up yet —
# a literal proxy_pass name is resolved at config load and would abort startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# Vite content-hashes everything it emits under /assets/, so those are cached
# for a year, but only when served: an error for a missing one must not be
# pinned by browsers or the edge.
map $status $asset_cache_control {
    ~^[23]  "public, max-age=31536000, immutable";
    default "no-store";
}

# Files copied from public/ under their own names (the fonts, the icon): an
# hour, so a replaced one is not pinned for a year.
map $status $named_cache_control {
    ~^[23]  "public, max-age=3600";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's version lands in error-page bodies. Caddy's `-Server` strips the
    # header on the way out but does not rewrite the body.
    server_tokens off;

    # The `$uri/` arm of try_files below makes nginx 301 a directory request
    # that is missing its trailing slash. By default that redirect is absolute
    # and built from this listen block — http://host:80 — which downgrades the
    # scheme behind Caddy's TLS. Relative redirects keep the client's own.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Off by default, so compressed responses ship without
    # `Vary: Accept-Encoding`. explorer. is Cloudflare-proxied
    # (`hosts` in terraform/dns.tf), and a shared cache needs the header to keep
    # the gzip and identity variants apart.
    gzip_vary on;

    # Same-origin API, mirroring the dev-server proxy in vite.config.ts. The
    # SPA is built with an empty VITE_API_BASE, so it requests /v1/... on its
    # own origin and never needs CORS.
    #
    # Override the upstream at runtime with -e EXPLORER_API=host:port only if
    # you also template this file; the default matches the compose service name.
    location /v1/ {
        set $explorer_api "http://explorer-webserver:3002";
        proxy_pass $explorer_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Let the origin's own Cache-Control decide; do not override it here.
        proxy_pass_request_headers on;

        # nginx defaults connect/read/send to 60s each. The connect default is
        # the one that bites: while explorer-webserver is down or restarting,
        # every request parks a worker connection for a full minute before
        # failing. Nothing downstream is that patient — 5s matches the
        # `connect_timeout`/`checkout_timeout` pgdog uses behind it.
        #
        # 30s for read: a request is a pool checkout (<=5s) plus the query, plus
        # at most one 5s price fetch (`default_price_timeout_ms` in
        # explorer-webserver's config.rs). Anything past 30s is stuck, and
        # surfacing that as a 504 beats holding the connection.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    location = /health {
        set $explorer_api_health "http://explorer-webserver:3002";
        proxy_pass $explorer_api_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        # The SPA polls this for its connectivity indicator, so a hung upstream
        # must fail fast rather than sit on the default 60s connect timeout.
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
    }

    location ~* ^/assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control $asset_cache_control always;
    }

    # Any other static file: the fonts and the icon from public/. Kept apart
    # from `location /` so a missing script, font or image is a 404, not
    # index.html.
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control $named_cache_control always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or a deploy leaves clients loading
        # hashed asset URLs that no longer exist.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
